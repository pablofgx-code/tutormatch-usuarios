services:
  postgres:
    image: postgres:16-alpine
    container_name: tutormatch-usuarios-db
    environment:
      POSTGRES_USER: tutormatch
      POSTGRES_PASSWORD: secretpassword
      POSTGRES_DB: usuarios_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tutormatch -d usuarios_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: