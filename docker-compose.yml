services:
  postgres:
    image: postgres:16-alpine
    container_name: tutormatch-usuarios-db
    environment:
      POSTGRES_USER: tutormatch
      POSTGRES_PASSWORD: secretpassword
      POSTGRES_DB: usuarios_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tutormatch -d usuarios_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  usuarios-grpc:
    build: .
    container_name: tutormatch-usuarios-grpc
    ports:
      - "50051:50051"
    environment:
      DATABASE_URL: "postgres://tutormatch:secretpassword@postgres:5432/usuarios_db?sslmode=disable"
      JWT_SECRET: "dev-secret-cambiar-en-produccion"
      PORT: "50051"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data: